services:
  - type: web
    name: applypilot-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build --workspace @applypilot/api
    startCommand: npm run db:deploy --workspace @applypilot/api && npm run start --workspace @applypilot/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: applypilot-db
          property: connectionString

databases:
  - name: applypilot-db
    databaseName: applypilot
    user: applypilot
    plan: free
    region: singapore
